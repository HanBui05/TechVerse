spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:${POSTGRES_HOST_PORT:5432}}/${POSTGRES_DB:techverse}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:${REDIS_HOST_PORT:6379}}
sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: ${SENDGRID_FROM_EMAIL}
  from-name: ${SENDGRID_FROM_NAME}
  template-id:
    register-success: ${SENDGRID_TEMPLATE_REGISTER_SUCCESS}

jwt:
  secret-key: ${JWT_SECRET_KEY}
server:
  port: ${SERVER_PORT:8080}