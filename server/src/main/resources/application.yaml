spring:
  application:
    name: server
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'; SET search_path TO techverse, public
  flyway:
    locations: classpath:db/migration
    schemas: techverse
    default-schema: techverse
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: techverse
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

jwt:
  secret-key: ${JWT_SECRET_KEY}
  issuer: https://api.techverse.local
  access-token-expiration: 15m
  refresh-token-expiration: 7d
  refresh-cookie-secure: false

oauth2:
  web-url: ${WEB_URL:http://localhost:3000}

password-reset:
  secret: ${PASSWORD_RESET_SECRET:${jwt.secret-key}}

sendgrid:
  template-id:
    reset-password-otp: ${SENDGRID_TEMPLATE_RESET_PASSWORD_OTP:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_ARTICLE_FOLDER:techverse/articles}
  cleanup-enabled: ${CLOUDINARY_CLEANUP_ENABLED:true}

article:
  imports-per-hour: 60
  uploads-per-hour: 100
