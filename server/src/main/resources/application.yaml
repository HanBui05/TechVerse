spring:
  application:
    name: server
  datasource:
    hikari:
      connection-init-sql: SET search_path TO techverse, public
  flyway:
    locations: classpath:db/migration
    schemas: techverse
    default-schema: techverse
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: techverse
