spring:
  application:
    name: server
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  mvc:
    async:
      request-timeout: ${AI_ASYNC_TIMEOUT:195s}
  ai:
    model:
      chat: ${AI_MODEL_CHAT:none}
      # The OpenAI starter enables every other model type by default; only chat is used.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${AI_API_KEY:}
      timeout: ${AI_TIMEOUT:60s}
      max-retries: ${AI_MAX_RETRIES:0}
      chat:
        model: ${AI_CHAT_MODEL:openai/gpt-oss-120b}
        max-completion-tokens: ${AI_MAX_COMPLETION_TOKENS:8192}
        reasoning-effort: ${AI_REASONING_EFFORT:low}
        replay-reasoning-content: false
        # include_reasoning=false is set in code: YAML binds it as the string "false" and Groq rejects that.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'; SET search_path TO techverse, public
  flyway:
    locations: classpath:db/migration
    schemas: techverse
    default-schema: techverse
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: techverse
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

jwt:
  secret-key: ${JWT_SECRET_KEY}
  issuer: https://api.techverse.local
  access-token-expiration: 15m
  refresh-token-expiration: 7d
  refresh-cookie-secure: false

oauth2:
  web-url: ${WEB_URL:http://localhost:3000}

password-reset:
  secret: ${PASSWORD_RESET_SECRET:${jwt.secret-key}}

sendgrid:
  template-id:
    reset-password-otp: ${SENDGRID_TEMPLATE_RESET_PASSWORD_OTP:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_ARTICLE_FOLDER:techverse/articles}
  cleanup-enabled: ${CLOUDINARY_CLEANUP_ENABLED:true}

ai:
  assist:
    outline-timeout: ${AI_OUTLINE_TIMEOUT:60s}
    draft-timeouts: {SHORT: 90s, MEDIUM: 120s, LONG: 180s}
    max-completion-tokens: {OUTLINE: 2048, SHORT: 4096, MEDIUM: 8192, LONG: 16384, TUTOR: 2048, EXERCISE: 4096, INTERVIEW_DRAFT: 8192, INTERVIEW_FEEDBACK: 2048}
    outline-per-day: ${AI_OUTLINE_PER_DAY:10}
    draft-per-day: ${AI_DRAFT_PER_DAY:5}
    tutor-per-day: ${AI_TUTOR_PER_DAY:20}
    tutor-timeout: ${AI_TUTOR_TIMEOUT:60s}
    exercise-per-day: ${AI_EXERCISE_PER_DAY:10}
    # Generation plus the strict second check share this budget.
    exercise-timeout: ${AI_EXERCISE_TIMEOUT:90s}
    interview-draft-per-day: ${AI_INTERVIEW_DRAFT_PER_DAY:10}
    interview-feedback-per-day: ${AI_INTERVIEW_FEEDBACK_PER_DAY:20}
    interview-timeout: ${AI_INTERVIEW_TIMEOUT:60s}
    burst-per-minute: ${AI_BURST_PER_MINUTE:3}
    completed-generation-ttl: 24h

# VietQR receiving account for manual transfers (backend only). Blank = payments unavailable (503).
vietqr:
  bank-id: ${VIETQR_BANK_ID:}
  account-no: ${VIETQR_ACCOUNT_NO:}
  account-name: ${VIETQR_ACCOUNT_NAME:}
  template: ${VIETQR_TEMPLATE:compact2}

# payOS is on only when all four are set (return-base-url: absolute http/https URL of the web app);
# then every new order is paid through payOS, otherwise through VietQR with Admin confirmation.
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-base-url: ${PAYOS_RETURN_BASE_URL:}

order:
  requests-per-minute: 5

article:
  imports-per-hour: 60
  uploads-per-hour: 100
