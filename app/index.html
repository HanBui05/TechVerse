<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechVerse — Explore Technology. Build Your Future.</title>
    <script>
      // Apply the saved theme before React renders so light users do not see a dark flash. Dark is the fallback.
      try {
        var saved = localStorage.getItem('techverse-theme')
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
