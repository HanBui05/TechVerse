name: techverse

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techverse}
      POSTGRES_USER: ${POSTGRES_USER:-techverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-techverse}
      POSTGRES_USER: ${POSTGRES_USER:-techverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_ARTICLE_FOLDER: ${CLOUDINARY_ARTICLE_FOLDER:-techverse/articles}
      CLOUDINARY_CLEANUP_ENABLED: ${CLOUDINARY_CLEANUP_ENABLED:-true}

      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}
      SENDGRID_TEMPLATE_REGISTER_SUCCESS: ${SENDGRID_TEMPLATE_REGISTER_SUCCESS:-}
      SENDGRID_TEMPLATE_RESET_PASSWORD_OTP: ${SENDGRID_TEMPLATE_RESET_PASSWORD_OTP:-}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:?Set PASSWORD_RESET_SECRET in .env}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-none}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-openai/gpt-oss-120b}
      AI_TIMEOUT: ${AI_TIMEOUT:-60s}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-0}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-low}
      AI_MAX_COMPLETION_TOKENS: ${AI_MAX_COMPLETION_TOKENS:-8192}
      AI_ASYNC_TIMEOUT: ${AI_ASYNC_TIMEOUT:-195s}
      AI_OUTLINE_PER_DAY: ${AI_OUTLINE_PER_DAY:-10}
      AI_DRAFT_PER_DAY: ${AI_DRAFT_PER_DAY:-5}
      AI_BURST_PER_MINUTE: ${AI_BURST_PER_MINUTE:-3}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
